coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        if_ci_failed: error
ignore:
  - "examples/**"
  - "docs/**"
  - "benchmarks/**"
  - "**/__pycache__/**"
  - "**/_version.py"
comment:
  require_changes: false
  require_base: false
  require_head: true
