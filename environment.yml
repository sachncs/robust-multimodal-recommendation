# morel — Conda environment

name: morel
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch::pytorch>=2.0,<3
  - numpy>=1.24,<3
  - scipy>=1.10,<2
  - scikit-learn>=1.3,<2
  - pytorch::torchvision>=0.15,<1
  - pandas>=2.0,<3
  - tqdm>=4.65,<5
  - pip
  - pip:
      - sentence-transformers>=2.2,<3
      - Pillow>=10.0,<12
      - pydantic>=2.0,<3
      - pyyaml>=6.0,<7
